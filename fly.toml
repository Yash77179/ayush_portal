# Fly.io config for the CareerBridge API (Django).
# App names are global on Fly — if "careerbridge-api" is taken, change it here and in the Vercel API URL.
app = "careerbridge-api"
primary_region = "bom"  # Mumbai

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Runs once per deploy, before the new version starts: create/alter tables, then (re)load the skills list.
  # Both are safe to repeat.
  release_command = "sh -c 'python manage.py migrate --noinput && python manage.py seed_skills'"

[env]
  DEBUG = "False"
  MEDIA_ROOT = "/data/media"
  ALLOWED_HOSTS = "*"
  PORT = "8000"

# Uploaded files live here and survive redeploys. A volume belongs to ONE machine,
# so keep this app at a single machine (see the deploy steps: `fly scale count 1`).
[mounts]
  source = "careerbridge_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"   # sleeps when idle (saves money); wakes on the next request in a few seconds
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health/"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
